[project]
name = "youtube_api"
version = "0.12.0"
description = "YouTube 播放清單自動化工具組：自動排序、重複偵測、關鍵字搜尋、發燒榜查詢"
authors = [{ name = "po-hsiang", email = "wsxxcv11733@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.65.0",
    "google-auth>=2.14.1",
    "google-auth-oauthlib>=0.7.1",
    "schedule>=1.2.2",
    "requests>=2.28.1",
    "mcp>=1.10",
    "tzdata>=2026.3",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
yt-sort = "youtube_toolkit.playlist_sorter:main"
yt-playlist-search = "youtube_toolkit.playlist_search:main"
yt-duplicates = "youtube_toolkit.duplicate_finder:main"
yt-video-search = "youtube_toolkit.video_search:main"
yt-health = "youtube_toolkit.playlist_health:main"
yt-clean = "youtube_toolkit.playlist_cleaner:main"
yt-mcp = "youtube_toolkit.mcp_server:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

# 套件採平鋪佈局（youtube_toolkit/ 位於專案根目錄，非 src/）
[tool.uv.build-backend]
module-name = "youtube_toolkit"
module-root = ""
